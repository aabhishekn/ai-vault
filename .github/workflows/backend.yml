name: Backend checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: ai_vault
          POSTGRES_PASSWORD: local_ci_password
          POSTGRES_DB: ai_vault
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ai_vault -d ai_vault"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_USER: ai_vault
      POSTGRES_PASSWORD: local_ci_password
      POSTGRES_DB: ai_vault
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5433
      REDIS_URL: redis://127.0.0.1:6379/0
      ENABLE_EMBEDDINGS: "false"
      RUN_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      # LlamaIndex ships its NLTK data inside site-packages. The runner installs packages
      # group-writable, and NLTK refuses to read data from a directory others can write to,
      # so the chunking tests could not find the stopwords. Make the directory private.
      - name: Make the bundled NLTK data private to its owner
        run: >-
          chmod -R go-w "$(python -c 'import llama_index.core as core, pathlib;
          print(pathlib.Path(core.__file__).parent / "_static" / "nltk_cache")')"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m pytest -v
